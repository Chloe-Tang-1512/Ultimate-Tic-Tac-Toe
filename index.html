<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultimate Tic-Tac-Toe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE; --surface: #FFFFFF; --line: #D9D5CB; --text: #1C1B19; --muted: #6E6A60;
    --glow: #2E5AAC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161A; --surface: #1E2026; --line: #34363E; --text: #EDEDEE; --muted: #9A9AA3;
    }
  }
  :root[data-theme="dark"] { --bg: #15161A; --surface: #1E2026; --line: #34363E; --text: #EDEDEE; --muted: #9A9AA3; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    padding: max(24px, env(safe-area-inset-top, 0px)) 20px max(24px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  h1 { font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-weight: 700; font-size: clamp(1.3rem, 4vw, 1.7rem); letter-spacing: -0.01em; margin: 4px 0 0; }
  .sub { color: var(--muted); font-size: 0.92rem; max-width: 420px; text-align: center; line-height: 1.5; margin: 0; }
  .modes { display: flex; gap: 8px; margin-top: 4px; }
  .mode-btn {
    font-family: 'Inter'; font-weight: 600; font-size: 0.85rem; padding: 7px 16px;
    border-radius: 20px; border: 1.5px solid var(--line); background: transparent;
    color: var(--muted); cursor: pointer; transition: border-color .2s, color .2s;
  }
  .mode-btn.active { border-color: var(--glow); color: var(--text); }
  .mode-btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .status {
    font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-weight: 600; font-size: 0.95rem;
    display: flex; align-items: center; gap: 8px; min-height: 28px; text-align: center;
    transition: font-size 0.2s ease;
  }
  .status.over { font-size: 1.25rem; animation: popIn 0.35s ease; }
  .status.win { color: var(--glow); }
  @keyframes popIn { from { transform: scale(0.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .game {
    display: grid; gap: clamp(6px, 1.6vmin, 12px); background: var(--line); border-radius: 14px;
    padding: clamp(6px, 1.6vmin, 12px); width: min(94vw, 92vh - 240px, 540px); aspect-ratio: 1;
  }
  .board {
    display: grid; gap: 2px; background: var(--line); border-radius: 6px;
    overflow: hidden; position: relative; transition: box-shadow 0.25s ease;
    container-type: size;
  }
  .board.active { box-shadow: 0 0 0 3px var(--glow) inset, 0 0 14px -2px var(--glow); }
  .board.decided .cell { opacity: 0.3; }
  .board.draw { background-image: repeating-linear-gradient(45deg, var(--line), var(--line) 5px, var(--surface) 5px, var(--surface) 10px); }
  .game.game-over .board:not(.win-line) { opacity: 0.3; transition: opacity 0.4s ease; }
  .board.win-line { animation: winPulse 1.3s ease-in-out infinite; }
  @keyframes winPulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--glow) inset, 0 0 12px 1px var(--glow); }
    50% { box-shadow: 0 0 0 3px var(--glow) inset, 0 0 26px 6px var(--glow); }
  }
  @media (prefers-reduced-motion: reduce) {
    .board.win-line { animation: none; box-shadow: 0 0 0 3px var(--glow) inset, 0 0 18px 3px var(--glow); }
    .status.over { animation: none; }
  }
  .cell { background: var(--surface); border: none; padding: 0; margin: 0; position: relative; cursor: pointer; container-type: size; }
  .cell:disabled { cursor: default; }
  .cell:not(:disabled):hover { filter: brightness(0.96); }
  @media (prefers-color-scheme: dark) { .cell:not(:disabled):hover { filter: brightness(1.2); } }
  .cell:focus-visible { outline: 2px solid var(--glow); outline-offset: -2px; }
  .mark-emoji { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 58cqmin; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 2; line-height: 1; font-size: 80cqmin;
  }
  button.reset {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem;
    background: transparent; color: var(--text); border: 1.5px solid var(--line);
    border-radius: 8px; padding: 9px 18px; cursor: pointer; transition: border-color 0.2s ease;
  }
  button.reset:hover { border-color: var(--muted); }
  button.reset:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  details.customize { width: min(94vw, 540px); border: 1.5px solid var(--line); border-radius: 12px; padding: 2px 16px 16px; }
  details.customize summary { cursor: pointer; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-weight: 600; font-size: 0.9rem; padding: 12px 0; list-style: none; color: var(--text); }
  details.customize summary::-webkit-details-marker { display: none; }
  details.customize summary::before { content: '▸  '; color: var(--muted); }
  details.customize[open] summary::before { content: '▾  '; }
  .custom-row { margin-top: 12px; }
  .custom-row .label { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .team-block { padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; }
  .team-block + .team-block { margin-top: 12px; }
  .team-block .label:not(:first-child) { margin-top: 12px; }
  .swatches, .emojis { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; background: var(--sw); }
  .swatch.active { border-color: var(--text); }
  .swatch:disabled { opacity: 0.3; cursor: not-allowed; }
  .swatch:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .emoji-btn {
    width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface);
    cursor: pointer; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .emoji-btn.active { border-color: var(--text); }
  .emoji-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .emoji-btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .name-input {
    width: 100%; font-family: 'Inter'; font-size: 0.88rem; padding: 8px 10px;
    border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
  }
  .name-input::placeholder { color: var(--muted); }
  .name-input:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
  .name-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .name-row .name-input { flex: 1; min-width: 120px; }
</style>
</head>
<body>
  <h1>Ultimate Tic-Tac-Toe</h1>
  <p class="sub">Win three small boards in a row to win the game. Wherever you play inside a board sends the next move to that same-position board.</p>
  <div class="modes">
    <button class="mode-btn" id="mode-2" type="button">2 players</button>
    <button class="mode-btn" id="mode-teams" type="button">2v2 teams</button>
  </div>
  <div class="status" id="status"></div>
  <div class="game" id="game"></div>
  <button class="reset" id="reset">New game</button>
  <details class="customize">
    <summary>Customize</summary>
    <div class="custom-row">
      <div class="label">Color theme</div>
      <div class="swatches" id="theme-swatches"></div>
    </div>
    <div class="custom-row" id="symbols-2player">
      <div class="label">Names</div>
      <div class="name-row">
        <input class="name-input" id="name-p0" type="text" maxlength="24" placeholder="Player 1">
        <input class="name-input" id="name-p1" type="text" maxlength="24" placeholder="Player 2">
      </div>
      <div class="label" style="margin-top:12px">Mark 1 symbol</div>
      <div class="emojis" id="emoji-0"></div>
      <div class="label" style="margin-top:12px">Mark 2 symbol</div>
      <div class="emojis" id="emoji-1"></div>
    </div>
    <div class="custom-row" id="symbols-teams" hidden>
      <div class="team-block">
        <input class="name-input" id="name-team-0" type="text" maxlength="24" placeholder="Team 1">
        <div class="label" style="margin-top:12px">Team color</div>
        <div class="swatches" id="team-color-0"></div>
        <div class="label">Player 1</div>
        <input class="name-input" id="name-team-0-0" type="text" maxlength="24" placeholder="Player 1">
        <div class="emojis" id="team-emoji-0-0" style="margin-top:8px"></div>
        <div class="label">Player 2</div>
        <input class="name-input" id="name-team-0-1" type="text" maxlength="24" placeholder="Player 2">
        <div class="emojis" id="team-emoji-0-1" style="margin-top:8px"></div>
      </div>
      <div class="team-block">
        <input class="name-input" id="name-team-1" type="text" maxlength="24" placeholder="Team 2">
        <div class="label" style="margin-top:12px">Team color</div>
        <div class="swatches" id="team-color-1"></div>
        <div class="label">Player 1</div>
        <input class="name-input" id="name-team-1-0" type="text" maxlength="24" placeholder="Player 1">
        <div class="emojis" id="team-emoji-1-0" style="margin-top:8px"></div>
        <div class="label">Player 2</div>
        <input class="name-input" id="name-team-1-1" type="text" maxlength="24" placeholder="Player 2">
        <div class="emojis" id="team-emoji-1-1" style="margin-top:8px"></div>
      </div>
    </div>
  </details>

<script>
const CONFIGS = {
  '2': { n: 3, win: 3, turns: [{ mark: 0 }, { mark: 1 }] },
  'teams': { n: 3, win: 3, turns: [
    { mark: 0, player: 1 }, { mark: 1, player: 1 },
    { mark: 0, player: 2 }, { mark: 1, player: 2 }
  ]}
};
const THEMES = [
  { name: 'Classic', light: '#2E5AAC', dark: '#7FA6FF' },
  { name: 'Ocean', light: '#1B7A8C', dark: '#5FD3E8' },
  { name: 'Forest', light: '#2F7D4F', dark: '#6FD99A' },
  { name: 'Berry', light: '#7B3FA0', dark: '#C9A3FF' },
  { name: 'Mono', light: '#2A2A2A', dark: '#F2F2F2' }
];
const EMOJIS = ['⭕', '❌', '💧', '🔥', '🪨', '🌀', '⚡', '🩸', '💎', '💥', '⭐'];
const emojiNames = { '⭕':'Circle', '❌':'Cross', '💧':'Water', '🔥':'Fire', '🪨':'Rock', '🌀':'Cyclone', '⚡':'Lightning', '🩸':'Blood', '💎':'Gem', '💥':'Boom', '⭐':'Star' };

// Each team picks one of these color families; the two teammates then pick any
// emoji from within it, so every symbol on their side is naturally that color —
// no tinting, just curated sets of emoji that are already red, green, blue, etc.
const COLOR_GROUPS = [
  { name: 'Red',    hex: '#D64545', emojis: ['❤️','🟥','🔴','♦️','🩸','💢','⭕'] },
  { name: 'Orange', hex: '#D97706', emojis: ['🧡','🟧','🟠','🔶','🦊','🍊','💥'] },
  { name: 'Yellow', hex: '#CA8A04', emojis: ['💛','🟨','🟡','⭐','⚡','🌟','🍋'] },
  { name: 'Green',  hex: '#2F9E44', emojis: ['💚','🟩','🟢','🧩','🔋','⚛️','✳️'] },
  { name: 'Blue',   hex: '#2563EB', emojis: ['💙','🟦','🔵','🔷','💎','🌀','💧'] },
  { name: 'Purple', hex: '#7C3AED', emojis: ['💜','🟪','🟣','🔮','🍆','🦄','🍇'] }
];

let emojiChoice = ['⭕', '❌'];
let themeIdx = 0;
let teamColorIdx = [4, 0]; // default Team 1 = Blue, Team 2 = Red
let teamSymbols = [
  [COLOR_GROUPS[4].emojis[0], COLOR_GROUPS[4].emojis[1]],
  [COLOR_GROUPS[0].emojis[0], COLOR_GROUPS[0].emojis[1]]
];
let playerNames = ['Player 1', 'Player 2'];
let teamNames = ['Team 1', 'Team 2'];
let teamPlayerNames = [['Player 1', 'Player 2'], ['Player 1', 'Player 2']];

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function teamColor(teamIdx) {
  return COLOR_GROUPS[teamColorIdx[teamIdx]].hex;
}

function cellMarkup(markIdx, player) {
  const emoji = (currentMode === 'teams' && player) ? teamSymbols[markIdx][player - 1] : emojiChoice[markIdx];
  return `<span class="mark-emoji">${emoji}</span>`;
}
function overlayMarkup(markIdx) {
  return currentMode === 'teams' ? teamSymbols[markIdx][0] : emojiChoice[markIdx];
}
function turnLabel(t) {
  if (currentMode === 'teams') {
    const sym = teamSymbols[t.mark][t.player - 1];
    const team = esc(teamNames[t.mark].trim() || `Team ${t.mark + 1}`);
    const player = esc(teamPlayerNames[t.mark][t.player - 1].trim() || `Player ${t.player}`);
    return `${team} (${sym}) — ${player} to move`;
  }
  const name = esc(playerNames[t.mark].trim() || `Player ${t.mark + 1}`);
  return `${emojiChoice[t.mark]} ${name} to move`;
}
function winLabel(markIdx) {
  if (currentMode === 'teams') {
    const team = esc(teamNames[markIdx].trim() || `Team ${markIdx + 1}`);
    return `${team} wins the game`;
  }
  const name = esc(playerNames[markIdx].trim() || `Player ${markIdx + 1}`);
  return `${emojiChoice[markIdx]} ${name} wins the game`;
}

const linesCache = {};
function getLines(n, k) {
  const key = n + '_' + k;
  if (linesCache[key]) return linesCache[key];
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  const lines = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) for (const [dr, dc] of dirs) {
    const line = [];
    let ok = true;
    for (let i = 0; i < k; i++) {
      const rr = r + dr*i, cc = c + dc*i;
      if (rr < 0 || rr >= n || cc < 0 || cc >= n) { ok = false; break; }
      line.push(rr*n + cc);
    }
    if (ok) lines.push(line);
  }
  linesCache[key] = lines;
  return lines;
}
function checkWinIdx(arr, n, k) {
  for (const line of getLines(n, k)) {
    const v = arr[line[0]];
    if (v === null || v === 'D') continue;
    if (line.every(i => arr[i] === v)) return v;
  }
  return null;
}
function findWinningLine(arr, n, k) {
  for (const line of getLines(n, k)) {
    const v = arr[line[0]];
    if (v === null || v === 'D') continue;
    if (line.every(i => arr[i] === v)) return line;
  }
  return null;
}

let N, WIN, turns, currentMode = '2';
let cells, cellPlayer, boardWinners, activeBoard, turnIdx, over, winnerIdx;
let boardEls = [], cellEls = [], overlayEls = [];
const gameEl = document.getElementById('game');
const statusEl = document.getElementById('status');

function buildDOM() {
  gameEl.innerHTML = '';
  gameEl.style.gridTemplateColumns = `repeat(${N},1fr)`;
  gameEl.style.gridTemplateRows = `repeat(${N},1fr)`;
  boardEls = []; cellEls = []; overlayEls = Array(N*N).fill(null);
  for (let b = 0; b < N*N; b++) {
    const boardEl = document.createElement('div');
    boardEl.className = 'board';
    boardEl.style.gridTemplateColumns = `repeat(${N},1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${N},1fr)`;
    const row = [];
    for (let c = 0; c < N*N; c++) {
      const cellEl = document.createElement('button');
      cellEl.className = 'cell';
      cellEl.type = 'button';
      cellEl.addEventListener('click', () => play(b, c));
      boardEl.appendChild(cellEl);
      row.push(cellEl);
    }
    gameEl.appendChild(boardEl);
    boardEls.push(boardEl);
    cellEls.push(row);
  }
}

function init() {
  const size = N*N;
  cells = Array(size*size).fill(null);
  cellPlayer = Array(size*size).fill(null);
  boardWinners = Array(size).fill(null);
  activeBoard = null; turnIdx = 0; over = false; winnerIdx = null;
  gameEl.classList.remove('game-over');
  statusEl.style.color = '';
  for (let b = 0; b < size; b++) {
    boardEls[b].className = 'board';
    for (let c = 0; c < size; c++) { cellEls[b][c].innerHTML = ''; cellEls[b][c].disabled = false; }
  }
  updateActiveHighlight();
  updateStatus();
}

function updateActiveHighlight() {
  const size = N*N;
  for (let b = 0; b < size; b++) {
    const isOpen = boardWinners[b] === null;
    const isActive = !over && isOpen && (activeBoard === null || activeBoard === b);
    boardEls[b].classList.toggle('active', isActive);
    for (let c = 0; c < size; c++) {
      cellEls[b][c].disabled = over || !isActive || cells[b*size + c] !== null;
    }
  }
}

function updateStatus() {
  statusEl.classList.remove('over', 'win');
  statusEl.style.color = '';
  if (over) {
    statusEl.classList.add('over');
    if (winnerIdx === 'D') {
      statusEl.textContent = "It's a draw.";
    } else {
      statusEl.classList.add('win');
      statusEl.innerHTML = winLabel(winnerIdx);
      if (currentMode === 'teams') statusEl.style.color = teamColor(winnerIdx);
    }
    return;
  }
  const where = activeBoard === null ? 'any open board' : `board ${activeBoard + 1}`;
  const t = turns[turnIdx];
  statusEl.innerHTML = `${turnLabel(t)} — play in ${where}`;
}

function play(b, c) {
  if (over) return;
  const size = N*N;
  const isOpen = boardWinners[b] === null;
  const isActive = isOpen && (activeBoard === null || activeBoard === b);
  const idx = b*size + c;
  if (!isActive || cells[idx] !== null) return;

  const markIdx = turns[turnIdx].mark;
  const player = turns[turnIdx].player;
  cells[idx] = markIdx;
  cellPlayer[idx] = player || null;
  cellEls[b][c].innerHTML = cellMarkup(markIdx, player);
  cellEls[b][c].disabled = true;

  const boardVals = cells.slice(b*size, b*size + size);
  const boardWin = checkWinIdx(boardVals, N, WIN);
  if (boardWin !== null) {
    boardWinners[b] = boardWin;
    boardEls[b].classList.add('decided');
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.textContent = overlayMarkup(boardWin);
    boardEls[b].appendChild(ov);
    overlayEls[b] = ov;
  } else if (boardVals.every(v => v !== null)) {
    boardWinners[b] = 'D';
    boardEls[b].classList.add('decided', 'draw');
  }

  const gameWin = checkWinIdx(boardWinners, N, WIN);
  if (gameWin !== null) {
    over = true; winnerIdx = gameWin;
    gameEl.classList.add('game-over');
    const line = findWinningLine(boardWinners, N, WIN);
    if (line) line.forEach(i => boardEls[i].classList.add('win-line'));
  }
  else if (boardWinners.every(v => v !== null)) { over = true; winnerIdx = 'D'; gameEl.classList.add('game-over'); }
  else {
    activeBoard = boardWinners[c] !== null ? null : c;
    turnIdx = (turnIdx + 1) % turns.length;
  }
  updateActiveHighlight();
  updateStatus();
}

function refreshMarks() {
  const size = N*N;
  for (let b = 0; b < size; b++) {
    for (let c = 0; c < size; c++) {
      const idx = b*size + c;
      if (cells[idx] !== null) cellEls[b][c].innerHTML = cellMarkup(cells[idx], cellPlayer[idx]);
    }
    if (typeof boardWinners[b] === 'number' && overlayEls[b]) {
      overlayEls[b].textContent = overlayMarkup(boardWinners[b]);
    }
  }
}

function setMode(key) {
  currentMode = key;
  const cfg = CONFIGS[key];
  N = cfg.n; WIN = cfg.win; turns = cfg.turns;
  document.getElementById('mode-2').classList.toggle('active', key === '2');
  document.getElementById('mode-teams').classList.toggle('active', key === 'teams');
  document.getElementById('symbols-2player').hidden = key === 'teams';
  document.getElementById('symbols-teams').hidden = key !== 'teams';
  buildDOM();
  init();
}

function applyTheme(i) {
  themeIdx = i;
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.style.setProperty('--glow', THEMES[i][dark ? 'dark' : 'light']);
  refreshCustomizeActive();
}
function setEmoji(markIdx, emoji) {
  const otherIdx = markIdx === 0 ? 1 : 0;
  if (emojiChoice[otherIdx] === emoji) return;
  emojiChoice[markIdx] = emoji;
  refreshCustomizeActive();
  refreshMarks();
  updateStatus();
}
function setTeamSymbol(teamIdx, playerIdx, emoji) {
  teamSymbols[teamIdx][playerIdx] = emoji;
  refreshCustomizeActive();
  refreshMarks();
  updateStatus();
}
function renderTeamEmojiPicker(teamIdx, playerIdx) {
  const container = document.getElementById(`team-emoji-${teamIdx}-${playerIdx}`);
  container.innerHTML = '';
  const group = COLOR_GROUPS[teamColorIdx[teamIdx]];
  group.emojis.forEach(emoji => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'emoji-btn'; b.setAttribute('aria-label', emoji);
    b.textContent = emoji;
    b.addEventListener('click', () => setTeamSymbol(teamIdx, playerIdx, emoji));
    container.appendChild(b);
  });
}
function setTeamColor(teamIdx, colorIdx) {
  const otherIdx = teamIdx === 0 ? 1 : 0;
  if (teamColorIdx[otherIdx] === colorIdx) return;
  teamColorIdx[teamIdx] = colorIdx;
  const group = COLOR_GROUPS[colorIdx];
  teamSymbols[teamIdx] = [group.emojis[0], group.emojis[1]];
  renderTeamEmojiPicker(teamIdx, 0);
  renderTeamEmojiPicker(teamIdx, 1);
  refreshCustomizeActive();
  refreshMarks();
  updateStatus();
}
function refreshCustomizeActive() {
  document.querySelectorAll('#theme-swatches .swatch').forEach((b, i) => b.classList.toggle('active', i === themeIdx));
  [0, 1].forEach(markIdx => {
    const otherIdx = markIdx === 0 ? 1 : 0;
    const container = document.getElementById('emoji-' + markIdx);
    [...container.children].forEach((b, i) => {
      b.classList.toggle('active', EMOJIS[i] === emojiChoice[markIdx]);
      b.disabled = EMOJIS[i] === emojiChoice[otherIdx];
    });
  });
  [0, 1].forEach(teamIdx => {
    const otherTeam = teamIdx === 0 ? 1 : 0;
    const colorContainer = document.getElementById('team-color-' + teamIdx);
    [...colorContainer.children].forEach((b, i) => {
      b.classList.toggle('active', i === teamColorIdx[teamIdx]);
      b.disabled = i === teamColorIdx[otherTeam];
    });
    [0, 1].forEach(playerIdx => {
      const group = COLOR_GROUPS[teamColorIdx[teamIdx]];
      const ec = document.getElementById(`team-emoji-${teamIdx}-${playerIdx}`);
      [...ec.children].forEach((b, i) => b.classList.toggle('active', group.emojis[i] === teamSymbols[teamIdx][playerIdx]));
    });
  });
}
function buildCustomizePanel() {
  const swEl = document.getElementById('theme-swatches');
  THEMES.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.setAttribute('aria-label', t.name + ' theme');
    b.style.setProperty('--sw', t.light);
    b.addEventListener('click', () => applyTheme(i));
    swEl.appendChild(b);
  });
  [0, 1].forEach(markIdx => {
    const container = document.getElementById('emoji-' + markIdx);
    EMOJIS.forEach(emoji => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'emoji-btn'; b.setAttribute('aria-label', emojiNames[emoji]);
      b.textContent = emoji;
      b.addEventListener('click', () => setEmoji(markIdx, emoji));
      container.appendChild(b);
    });
  });
  [0, 1].forEach(teamIdx => {
    const colorContainer = document.getElementById('team-color-' + teamIdx);
    COLOR_GROUPS.forEach((group, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch'; b.setAttribute('aria-label', group.name);
      b.style.setProperty('--sw', group.hex);
      b.addEventListener('click', () => setTeamColor(teamIdx, i));
      colorContainer.appendChild(b);
    });
    renderTeamEmojiPicker(teamIdx, 0);
    renderTeamEmojiPicker(teamIdx, 1);
  });
  refreshCustomizeActive();
}

function wireNameInputs() {
  document.getElementById('name-p0').addEventListener('input', e => { playerNames[0] = e.target.value.slice(0, 24); updateStatus(); });
  document.getElementById('name-p1').addEventListener('input', e => { playerNames[1] = e.target.value.slice(0, 24); updateStatus(); });
  document.getElementById('name-team-0').addEventListener('input', e => { teamNames[0] = e.target.value.slice(0, 24); updateStatus(); });
  document.getElementById('name-team-1').addEventListener('input', e => { teamNames[1] = e.target.value.slice(0, 24); updateStatus(); });
  [0, 1].forEach(teamIdx => {
    [0, 1].forEach(playerIdx => {
      document.getElementById(`name-team-${teamIdx}-${playerIdx}`).addEventListener('input', e => {
        teamPlayerNames[teamIdx][playerIdx] = e.target.value.slice(0, 24);
        updateStatus();
      });
    });
  });
}

document.getElementById('mode-2').addEventListener('click', () => setMode('2'));
document.getElementById('mode-teams').addEventListener('click', () => setMode('teams'));
document.getElementById('reset').addEventListener('click', () => setMode(currentMode));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(themeIdx));
buildCustomizePanel();
wireNameInputs();
applyTheme(0);
setMode('2');
</script>
</body>
</html>
